# Otomatis: build React (Vite) lalu upload hasilnya ke subdomain Hostinger via FTP.
# Setiap kali kamu "push" ke branch di bawah, situs langsung ter-update.
#
# RESEP TERUJI (Hostinger):
#   1. Buat SUBDOMAIN di hPanel (Domain → Subdomain) → foldernya public_html/<nama-sub>
#   2. Buat AKUN FTP KHUSUS (File → Akun FTP) dengan Direktori = /public_html/<nama-sub>
#   3. Isi 4 secrets (GitHub → Settings → Secrets and variables → Actions):
#        FTP_SERVER      -> IP/host FTP TANPA awalan ftp://   (mis. 46.202.138.192)
#        FTP_USERNAME    -> username akun FTP khusus tadi     (mis. u509575013.namasub)
#        FTP_PASSWORD    -> password akun FTP khusus tadi
#        FTP_SERVER_DIR  -> /   (satu garis miring saja — akun sudah terkunci di folder sub!)
#   4. Push → live. Pre-flight di bawah akan menyebut penyebabnya dengan jelas kalau ada
#      yang salah (secret kosong, salah password, path absolut, dsb).
#
# Untuk sekolah lain: copy repo ini, ubah src/config/school.js + src/data/content.js +
# gambar di src/assets/, lalu ulangi langkah 1-3 untuk subdomain sekolah tersebut.

name: Deploy ke Hostinger

on:
  push:
    branches:
      - claude/portal-sman-1-raja-ampat-8yxuqm
      - main
  workflow_dispatch: {}   # bisa juga dijalankan manual dari tab Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # Bersihkan input agar tahan salah-copy dari panel Hostinger:
      # - FTP_SERVER boleh tersalin sebagai "ftp://1.2.3.4" -> prefix dibuang otomatis
      # - FTP_SERVER_DIR kosong -> "/", dan "/" di akhir ditambahkan otomatis
      # Catatan: hasilnya dioper lewat GITHUB_ENV, BUKAN step output — GitHub
      # memblokir output yang nilainya sama persis dengan sebuah secret.
      - name: Normalisasi input FTP
        run: |
          server="${{ secrets.FTP_SERVER }}"
          server="${server#ftps://}"
          server="${server#ftp://}"
          server="${server%%/*}"
          echo "FTP_HOST=$server" >> "$GITHUB_ENV"
          dir="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$dir" ]; then dir="/"; fi
          case "$dir" in
            */) : ;;
            *) dir="$dir/" ;;
          esac
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"

      # Gagal cepat dengan pesan yang jelas kalau server/username/password salah,
      # SEBELUM buang waktu build. Password tidak pernah dicetak ke log.
      - name: Tes koneksi & login FTP (pre-flight)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Pastikan tidak ada secret yang kosong — sebut namanya kalau ada.
          missing=""
          [ -z "$FTP_HOST" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USER" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASS" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Secret kosong::Secret berikut KOSONG atau tidak terbaca:$missing"
            echo "Perbaiki: GitHub → Settings → Secrets and variables → Actions →"
            echo "hapus secret tersebut lalu buat ulang (New repository secret) dengan nilainya."
            exit 1
          fi
          # Akun FTP khusus subdomain sudah "terkunci" di foldernya — path absolut
          # /home/... di FTP_SERVER_DIR justru membuat folder bersarang yang salah.
          case "$FTP_DIR" in
            /home/*|/domains/*)
              echo "::error title=FTP_SERVER_DIR salah::Nilainya path absolut server ($FTP_DIR)."
              echo "Untuk akun FTP yang direktorinya sudah diset ke folder subdomain, isi '/' saja."
              exit 1 ;;
          esac
          server="$FTP_HOST"
          echo "Menguji ftp://$server/ dengan user: $FTP_USER"
          set +e
          out=$(curl -sS --max-time 45 "ftp://$server/" --user "$FTP_USER:$FTP_PASS" 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error title=Koneksi FTP gagal::$out"
            echo ""
            echo "──────── DIAGNOSIS ────────"
            case "$out" in
              *"530"*|*"Access denied"*|*"login"*|*"Login"*)
                echo "→ USERNAME atau PASSWORD salah."
                echo "  Cara pasti: Hostinger → Akun FTP → 'Ubah password' pada akun ini,"
                echo "  buat password baru, lalu perbarui secret FTP_PASSWORD di GitHub." ;;
              *"resolve"*|*"Could not resolve"*)
                echo "→ FTP_SERVER salah / tidak dikenal: '$server'" ;;
              *"timed out"*|*"timeout"*)
                echo "→ Server tidak menjawab di port 21 (timeout)." ;;
              *"SSL"*|*"TLS"*|*"encryption"*)
                echo "→ Server mewajibkan FTPS. Ganti 'protocol: ftp' menjadi 'ftps' di workflow ini." ;;
              *)
                echo "→ Lihat pesan error di atas." ;;
            esac
            exit 1
          fi
          echo "Login FTP OK ✓ — isi direktori root akun:"
          echo "$out" | head -20

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Build (menghasilkan folder dist/)
        run: npm run build

      - name: Upload dist/ ke Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp          # ganti ke "ftps" kalau Hostinger mewajibkan FTP over TLS
          port: 21
          local-dir: ./dist/     # HARUS diakhiri "/"
          server-dir: ${{ env.FTP_DIR }}
          # Hanya meng-upload file yang berubah (cepat). File state disimpan di server
          # sebagai .ftp-deploy-sync-state.json — biarkan saja, itu normal.
